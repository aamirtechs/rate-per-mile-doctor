[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-per-mile-doctor"
version = "1.0.0"
description = "Compare truck loads against DAT national spot benchmarks by equipment type, with deadhead-adjusted rates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
rate-per-mile-doctor = "rate_per_mile_doctor:main_entry"

[tool.setuptools]
py-modules = ["rate_per_mile_doctor"]
